architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/peaceandlove.accesswidener")
}

// ── 调试端口构建开关 ────────────────────────────────────────────
// 验证用 JSON-RPC（默认 25585，读怪物仇恨状态）只应出现在开发/测试构建。
//   正式打包  ./gradlew build                      -> ENABLE_VERIFY_RPC=false（端口不启动）
//   开发/测试 ./gradlew :neoforge:runClient -PenableVerifyRpc=true
// 生成编译期常量，关闭时启动代码被 javac 常量折叠直接消除。
def enableVerifyRpc = project.findProperty("enableVerifyRpc") == "true"
def generatedFlagsDir = layout.buildDirectory.dir("generated/sources/buildflags/java").get().asFile

def generateBuildFlags = tasks.register("generateBuildFlags") {
    inputs.property("enableVerifyRpc", enableVerifyRpc)
    outputs.dir(generatedFlagsDir)
    doLast {
        def pkgDir = new File(generatedFlagsDir, "top/windyvalley/peaceandlove")
        pkgDir.mkdirs()
        new File(pkgDir, "BuildFlags.java").text = """\
package top.windyvalley.peaceandlove;

/** 由 Gradle 按构建开关生成，勿手改。 */
public final class BuildFlags {
    /** 验证用 JSON-RPC 端口是否启用（正式构建为 false）。 */
    public static final boolean ENABLE_VERIFY_RPC = ${enableVerifyRpc};

    private BuildFlags() {
    }
}
"""
    }
}

sourceSets {
    main {
        java.srcDir(generatedFlagsDir)
    }
}

tasks.named("compileJava") {
    dependsOn(generateBuildFlags)
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // 纯逻辑单测（不依赖 MC runtime 的部分）
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
