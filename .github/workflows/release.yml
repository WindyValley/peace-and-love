name: release-ci

# 打版本标签时触发（如 v1.0.0）。只在标签上跑，普通推送不跑。
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 需要写权限才能创建 Release、上传产物

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar \
            || (echo "::error::gradle-wrapper.jar 缺失" && exit 1)
          chmod +x gradlew

      - name: Build release jars
        # 版本号取自触发的标签：标签 v0.1.0 -> 构建版本 0.1.0。
        # 不带 -PenableVerifyRpc：默认正式构建，调试端口编译期已关闭。
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "构建版本：$VERSION（标签 $TAG_NAME）"
          ./gradlew build --no-daemon --stacktrace -PmodVersion="$VERSION"

      - name: Stage release jars
        # 只挑可分发主产物，按加载器重命名，避免 Fabric/NeoForge
        # 同名文件（都叫 peaceandlove-<v>.jar）汇总时互相覆盖。
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          for loader in fabric neoforge; do
            src="$loader/build/libs/peaceandlove-$VERSION.jar"
            if [ -f "$src" ]; then
              cp "$src" "dist/peaceandlove-$VERSION-$loader.jar"
            else
              echo "::error::找不到 $src"
              exit 1
            fi
          done
          echo "=== 待上传产物 ==="
          ls -la dist

      - name: Create GitHub Release and upload jars
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} (alpha)
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 0.x 一律标记为预发布，不当作正式版本
          prerelease: true
          # 重跑时覆盖同名 Release
          make_latest: false
