plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        client {
            // 自动化测试：离线用户名 Dev；启动后停在标题屏。
            // 连接服务器由测试脚本（launch_and_connect.py）在初始化走完后显式发起，
            // 不用 --quickPlayMultiplayer：它会在资源/Mod 未加载完时抢连，
            // 出现「进服后又跳回标题屏」的时序问题。
            programArgs "--username", "Dev"
            // 窗口调小，减少自动化测试时的渲染开销
            programArgs "--width", "854"
            programArgs "--height", "480"
        }
    }
}

configurations {
    common { canBeResolved = true }
    shadowCommon { canBeResolved = true }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}
